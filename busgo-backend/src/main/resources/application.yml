server:
  port: 8080

spring:
  application:
    name: busgo-backend
  profiles:
    # Override with SPRING_PROFILES_ACTIVE=prod
    active: dev
  jpa:
    open-in-view: false

busgo:
  jwt:
    # HS256 needs >= 32 bytes. The default below is for local dev ONLY.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    # Comma separated list. Vite dev server by default.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    admin:
      email: ${ADMIN_EMAIL:admin@busgo.com}
      password: ${ADMIN_PASSWORD:Admin@123}
      name: Admin

springdoc:
  swagger-ui:
    path: /swagger-ui.html
