# Dev profile: in-memory H2 (data resets on every restart; the admin user is re-seeded).
# H2 runs in PostgreSQL compatibility mode so SQL written here also works on Postgres.
# Want data to survive restarts? Use: jdbc:h2:file:./data/busgo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring:
  datasource:
    url: jdbc:h2:mem:busgo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    com.busgo: DEBUG
